<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur de Bannière LinkedIn</title>
    <style>
        /* On centre la bannière sur la page avec un fond gris foncé autour pour bien la voir */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- TAILLE EXACTE EXIGÉE PAR LES RÉSEAUX SOCIAUX --- */
        .banner {
            width: 1200px;
            height: 630px;
            background: radial-gradient(circle at right, #0f172a 0%, #050a14 100%);
            display: flex;
            align-items: center;
            padding: 0 80px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* Petit effet de grille en fond (ambiance réseau/cyber) */
        .banner::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            transform: rotate(-10deg);
        }

        .content {
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 70px;
            width: 100%;
        }

        /* Ta photo de profil */
        .profile {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #38bdf8;
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.5); /* La fameuse lueur cyan */
        }

        /* Bloc de texte */
        .text-box {
            color: #e2e8f0;
            flex: 1;
        }

        h1 {
            font-size: 4.2rem;
            margin: 0;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        h2 {
            font-size: 2.4rem;
            color: #38bdf8;
            margin: 15px 0 25px 0;
            font-weight: 600;
        }

        p {
            font-size: 1.6rem;
            color: #94a3b8;
            margin-bottom: 50px;
            max-width: 650px;
            line-height: 1.4;
        }

        /* Section Logos */
        .logos {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .logo-badge {
            background: #1e293b;
            border: 1px solid rgba(56,189,248,0.3);
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- C'est ce bloc qu'il faudra capturer -->
    <div class="banner">
        <div class="content">
            <img src="photodeprofil.png" alt="Lauryn" class="profile">
            
            <div class="text-box">
                <h1>Lauryn Hecque--Nascimento</h1>
                <h2>Cybersécurité Défensive & OSINT</h2>
                <p>Découvrez mon portfolio, mes projets d'infrastructure réseaux et mes certifications.</p>
                
                <div class="logos">
                    <div class="logo-badge">Microsoft</div>
                    <div class="logo-badge">TryHackMe</div>
                    <div class="logo-badge">Stanford</div>
                    <div class="logo-badge">Fortinet</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
