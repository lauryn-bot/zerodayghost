<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bannière LinkedIn | Lauryn H-N</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Dimensions officielles de la bannière LinkedIn */
        .linkedin-banner {
            width: 1584px;
            height: 396px;
            background: radial-gradient(circle at center, #0f172a 0%, #050a14 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Effet de grille Cyber (Identique à ton portfolio) */
        .linkedin-banner::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            transform: rotate(-5deg);
        }

        /* Zone de sécurité à gauche pour la photo de profil LinkedIn */
        .safe-zone {
            width: 350px;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        /* Contenu principal (décalé à droite pour ne pas être caché par la photo) */
        .content {
            z-index: 1;
            flex: 1;
            padding: 40px 60px 40px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .name-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        h1 {
            color: #e2e8f0;
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: -1px;
            font-weight: 800;
        }

        .highlight {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        h2 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin: 0 0 20px 0;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .badges-row {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .cyber-badge {
            background: #1e293b;
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cyber-badge strong {
            color: #38bdf8;
        }

        .portfolio-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #94a3b8;
            font-size: 1.3rem;
            background: rgba(56, 189, 248, 0.05);
            padding: 10px 20px;
            border-radius: 50px;
            width: fit-content;
            border: 1px dashed rgba(56, 189, 248, 0.4);
        }

        .portfolio-link span {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ZONE À CAPTURER -->
    <div class="linkedin-banner">
        
        <!-- Espace vide à gauche pour laisser la place à ta photo de profil LinkedIn -->
        <div class="safe-zone"></div>

        <div class="content">
            <div class="name-wrapper">
                <h1>LAURYN HECQUE--NASCIMENTO</h1>
            </div>
            
            <h2>Blue Team • OSINT • Infrastructure Réseaux</h2>
            
            <div class="badges-row">
                <div class="cyber-badge">Top 5% World <strong>TryHackMe</strong></div>
                <div class="cyber-badge">Certifiée <strong>Security Blue Team</strong></div>
                <div class="cyber-badge">CTF DGA <strong>Deep Threats 184e/487</strong></div>
            </div>

            <div class="portfolio-link">
                Découvrez mes projets & Write-Ups sur <span>https://lauryn-bot.github.io/zerodayghost/</span>
            </div>
        </div>

    </div>

</body>
</html>
